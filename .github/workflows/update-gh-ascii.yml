name: Update gh-ascii profile card

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-card:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download dark and light cards
        run: |
          curl --fail --location --retry 3 "https://gh.crafter.run/tanvir-cpp?theme=dark" --output dark_mode.svg
          curl --fail --location --retry 3 "https://gh.crafter.run/tanvir-cpp?theme=light" --output light_mode.svg

      - name: Commit updated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dark_mode.svg light_mode.svg
          if git diff --cached --quiet; then
            echo "No card changes detected."
          else
            git commit -m "chore: update gh-ascii profile card"
            git push
          fi
